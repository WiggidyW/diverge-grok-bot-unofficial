# The two halves of the unofficial Grok Bot agent: the agent image, a
# thin wrapper, and its dependency tool, where Grok Bot is reached.
[workspace]
resolver = "3"
members = ["grok-bot-unofficial-agent", "grok-bot-unofficial-tool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ronald Lewis Riggles III"]
license = "MIT"
repository = "https://github.com/WiggidyW/diverge-grok-bot-unofficial"

[workspace.dependencies]
# The SDK, from GitHub and not from a registry, pinned to one commit.
diverge-sdk = { git = "https://github.com/divergenetwork/Diverge", rev = "e606d7a9f" }
async-stream = { version = "0.3.6" }
axum = { version = "0.8.9" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
schemars = { version = "1.2.3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
